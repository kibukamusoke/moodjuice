name: moodjuice
description: "An emotional espresso shot for your soul."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4
  
  # Routing
  go_router: ^14.2.7
  
  # Supabase
  supabase_flutter: ^2.4.0
  
  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  rive: ^0.12.4
  lottie: ^3.0.0
  flutter_hooks: ^0.20.5
  persistent_bottom_nav_bar: ^6.2.1
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  # Temporarily commented out due to compilation issues
  # flutter_local_notifications: ^14.1.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/